<!doctype html>
<html lang="en" class="preload">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friendship Day Gift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Knewave&family=Mea+Culpa&family=Mrs+Saint+Delafield&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="loader" class="loader" aria-hidden="true"></div>
    <div class="main-container">
      <img class="angry-cat" src="angry-cat.png" alt="Angry Cat" />
      <p class="how-dare-you mrs-saint-delafield-regular">How dare you!!?</p>
      <div class="buttons">
        <button class="btn cherry-bomb-one-regular">
          <a href="card.html">Go Back</a>
        </button>
      </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        document.documentElement.classList.remove("preload");
        document.documentElement.classList.add("loaded");
        var loader = document.getElementById("loader");
        if (loader) {
          loader.classList.add("fade-out");
          setTimeout(function () {
            loader.remove();
          }, 600);
        }
      });
    </script>
  </body>
</html>
